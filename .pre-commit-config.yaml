repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: Check Go formatting with gofmt.
        entry: gofmt
        language: system
        args: [-l, -w]
        types: [go]

      - id: go-vet
        name: go vet
        description: Report suspicious constructs with go vet.
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: go-build
        name: go build
        description: Ensure the module builds.
        entry: go build ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test
        description: Run the test suite.
        entry: go test ./...
        language: system
        pass_filenames: false
        types: [go]
